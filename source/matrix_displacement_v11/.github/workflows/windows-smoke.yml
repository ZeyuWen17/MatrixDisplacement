name: Windows Qt and build smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare isolated dependencies
        shell: pwsh
        run: |
          py -3 -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements-build-windows.txt
      - name: Run regression and Qt tests (offscreen)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          .\.venv\Scripts\python.exe -m pytest -q
          .\.venv\Scripts\python.exe -m matrix_displacement.gui --self-test
      - name: Build and test packaged GUI
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\build_exe_windows.ps1 -SkipTests
      - uses: actions/upload-artifact@v4
        with:
          name: MatrixDisplacement-V1.1-Windows-onedir-unverified-manual-GUI
          path: outputs/dist/V*/MatrixDisplacement/
          if-no-files-found: error
